name: build and deploy spring app

on:
  push:
    branches:
      - main

jobs:
      build-deploy:
        name: build and deploy spring boot for beginners
        runs-on: ubuntu-latest
        steps:
          - name: checkout code
            uses: actions/checkout@v2

          - name: setup JDK 17
            uses: actions/setup-java@v3
            with:
              distribution: "corretto"
              java-version: 17

          - name: unit tests
            run: mvn -B test --file pom.txt

          - name: build the application
            run: |
              mvn clean
              mvn -B package --file pom.txt
                
           
                








