name: build and deploy spring app

on:
  push:
    branches:
      - cicd
  workflow_dispatch:

jobs:
   build-deploy:
     name: build and deploy spring boot for beginners
     runs-on: ubuntu-latest
     steps:
       - name: checkout code
         uses: actions/checkout@v2


       - name: setup JDK 17
         uses: actions/setup-java@v3
         with:
           distribution: "corretto"
           java-version: 17

       - name: unit tests
         run: mvn -B test --file pom.xml

       - name: Build the application
         run: |
           mvn clean
           mvn -B package --file pom.xml

       - name: build docker image
         uses: docker/build-push-action@v5
         with:
           context: .
           file: Dockerfile
           push: false
           tags: ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-for-beginners:latest
       -  name : login to Docker hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUBACCESS_TOKEN}}

       -  name: Push to docker hub
          uses: docker/build-push-action@v5
          with:
            context: .
            file: Dockerfile
            push: true
            tags: ${{ secrets.pal1910 }}/spring-boot-for-beginners:latest








           
                








