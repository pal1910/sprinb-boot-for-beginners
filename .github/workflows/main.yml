name: build and deploy spring app

on:
  push:
    branches:
      - cicd
  workflow_dispatch:

jobs:
   build-deploy:
     name: build and deploy spring boot for beginners
     runs-on: ubuntu-latest
     steps:
       - name: checkout code
         uses: actions/checkout@v2


       - name: setup JDK 17
         uses: actions/setup-java@v3
         with:
           distribution: "corretto"
           java-version: 17

       - name: unit tests
         run: mvn -B test --file pom.xml

       - name: build the application
         run: |
          mvn clean
          mvn -B package --file pom.xml
                
       - name: build docker image
         uses: docker/build-push-action@v2
         with:
           context: .
           dockerfile: Dockerfile
           push: false
           tags:${{ secrets.Docker_hub_username }} /spring-boot-for-beginners: latest
       -  name : login to docker hub
          uses: docker/login-action@v1
          with:
            username: ${{ secrets.Docker_hub_username }}
            password: ${{ secrets.Docker_hubaccess_token }}

       -  name: Push to docker hub
          uses: docker/build-push-action@v2
          with:
            context: .
            dockerfile: Dockerfile
            push: true
            tags:${{ secrets.Docker_hub_usename }} /spring-boot-for-beginners: latest








           
                








